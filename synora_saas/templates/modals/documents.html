<!-- Documents Viewer Modal -->
<div id="documents-viewer-modal" class="modal-overlay hidden">
    <div class="modal-content" style="max-width: 950px; height: 80vh; display: flex; flex-direction: column; background: #ffffff; color: #1e293b; border: 1px solid #cbd5e1; box-shadow: 0 20px 40px rgba(0,0,0,0.3);">
        
        <div class="modal-header" style="border-bottom: 1px solid #e2e8f0; padding-bottom: 15px;">
            <h3 style="color: #0f172a; margin: 0; font-weight: 700; display: flex; align-items: center; gap: 10px;"><i class="fa-solid fa-book" style="color: #2563eb;"></i> {{ _('SaaS Documents') }}</h3>
            <button class="btn-close" onclick="document.getElementById('documents-viewer-modal').classList.add('hidden');" style="background: none; border: none; color: #64748b; font-size: 1.25rem; cursor: pointer; transition: color 0.2s;"><i class="fa-solid fa-times"></i></button>
        </div>

        <div class="modal-body" style="display: flex; flex: 1; overflow: hidden; gap: 0; padding: 10px 0; flex-direction: column;">
            
            <div style="display: flex; gap: 20px; border-bottom: 1px solid #e2e8f0; padding-bottom: 0px; margin-bottom: 15px; padding-left: 20px;">
                <button id="tab-system-docs" class="tab-btn" onclick="switchDocTab('system')" style="background: none; border: none; font-weight: 600; font-size: 0.95rem; color: #2563eb; cursor: pointer; padding-bottom: 10px; border-bottom: 2px solid #2563eb;">{{ _('System Docs') }}</button>
                <button id="tab-rag-docs" class="tab-btn" onclick="switchDocTab('rag')" style="background: none; border: none; font-weight: 600; font-size: 0.95rem; color: #64748b; cursor: pointer; padding-bottom: 10px; border-bottom: 2px solid transparent;">{{ _('RAG Database') }}</button>
            </div>

            <div id="view-system-docs" style="display: flex; flex: 1; overflow: hidden; width: 100%; gap: 24px;">
                <!-- Document List Sidebar -->
                <div style="width: 260px; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; overflow-y: auto; padding-right: 15px; padding-left: 20px;">
                    <h4 style="margin-top: 0; color: #64748b; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 15px;">{{ _('Available Documents') }}</h4>
                    <ul id="documents-list-ul" style="list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px;">
                        <!-- Populated dynamically via JS -->
                    </ul>
                </div>
                
                <!-- Markdown Render Area -->
                <div id="document-render-area" style="flex: 1; overflow-y: auto; padding-right: 20px; font-family: system-ui, -apple-system, sans-serif; line-height: 1.6; color: #334155;">
                    <div style="display: flex; height: 100%; align-items: center; justify-content: center; color: #94a3b8; font-size: 1.1rem;">
                        <i class="fa-solid fa-arrow-left" style="margin-right: 10px;"></i> {{ _('Select a document to start reading...') }}
                    </div>
                </div>
            </div>

            <div id="view-rag-docs" style="display: none; flex: 1; overflow-y: auto; padding: 0 20px; width: 100%;">
                <div style="margin-bottom: 15px; color: #64748b; font-size: 0.9rem;">
                    <i class="fa-solid fa-circle-info" style="margin-right: 5px;"></i> {{ _('Manage vectors stored in your tenant database for Hybrid Search augmentation.') }}
                </div>
                <table style="width: 100%; border-collapse: collapse; margin-top: 10px; background: #f8fafc; border-radius: 8px; overflow: hidden; border: 1px solid #e2e8f0;">
                    <thead style="background: #f1f5f9;">
                        <tr style="border-bottom: 1px solid #e2e8f0; color: #475569; text-align: left; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px;">
                            <th style="padding: 12px 16px;">{{ _('Document Context Name') }}</th>
                            <th style="padding: 12px 16px; width: 100px; text-align: right;">{{ _('Action') }}</th>
                        </tr>
                    </thead>
                    <tbody id="rag-documents-tbody">
                        <tr><td colspan="2" style="padding: 20px; text-align: center; color: #94a3b8;"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
    /* Styling for the high-contrast markdown output */
    #document-render-area h1, #document-render-area h2, #document-render-area h3 { color: #0f172a; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; margin-top: 24px; margin-bottom: 12px; font-weight: 700; }
    #document-render-area h1 { font-size: 1.8rem; }
    #document-render-area h2 { font-size: 1.4rem; }
    #document-render-area h3 { font-size: 1.2rem; }
    #document-render-area p { margin-bottom: 16px; font-size: 1rem; color: #334155; }
    #document-render-area pre { background: #f8fafc; padding: 14px; border-radius: 8px; overflow-x: auto; border: 1px solid #e2e8f0; margin: 16px 0; }
    #document-render-area code { background: #f1f5f9; padding: 3px 6px; border-radius: 4px; font-family: monospace; color: #df1b80; font-size: 0.9rem; }
    #document-render-area pre code { background: none; padding: 0; color: #0f172a; font-size: 0.95rem; }
    #document-render-area a { color: #2563eb; text-decoration: none; font-weight: 500; }
    #document-render-area a:hover { text-decoration: underline; }
    #document-render-area blockquote { border-left: 4px solid #3b82f6; margin: 16px 0; padding-left: 16px; color: #64748b; font-style: italic; }
    #document-render-area ul, #document-render-area ol { padding-left: 20px; margin-bottom: 16px; color: #334155; }
    #document-render-area li { margin-bottom: 6px; }
    
    .doc-list-item { background: #f8fafc; padding: 12px 16px; border-radius: 8px; cursor: pointer; transition: all 0.2s ease; border: 1px solid #e2e8f0; color: #475569; font-weight: 600; font-size: 0.9rem; }
    .doc-list-item:hover { background: #f1f5f9; border-color: #cbd5e1; color: #0f172a; }
    .doc-list-item.active { background: rgba(37, 99, 235, 0.08); border-color: #2563eb; color: #2563eb; }
</style>

<script>
    window.loadDocumentsList = async function() {
        const listUl = document.getElementById('documents-list-ul');
        listUl.innerHTML = '<div style="color: var(--text-dim); font-size: 0.9rem;"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading available documents...</div>';
        
        try {
            const token = sessionStorage.getItem('synora_token') || (typeof App !== 'undefined' ? App.token : '');
            if (!token) {
                listUl.innerHTML = '<div style="color: #e74c3c; font-size: 0.9rem;">Error: No passport token found in session. Please log in again.</div>';
                return;
            }
            const res = await fetch('/api/documents/list', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            
            if (res.status === 200 && data.success && data.documents) {
                if (data.documents.length === 0) {
                    listUl.innerHTML = '<div style="color: var(--text-dim); font-size: 0.9rem;">No documents available.</div>';
                } else {
                    listUl.innerHTML = '';
                    data.documents.forEach(doc => {
                        const li = document.createElement('li');
                        li.className = 'doc-list-item';
                        li.innerHTML = `<i class="fa-regular fa-file-lines" style="margin-right: 8px; opacity: 0.7;"></i> ${doc}`;
                        li.onclick = () => window.loadDocumentContent(doc, li);
                        listUl.appendChild(li);
                    });
                }
            } else {
                const errMsg = data.error || data.message || `Error ${res.status}: Failed to retrieve list.`;
                listUl.innerHTML = `<div style="color: #e74c3c; font-size: 0.9rem;">${errMsg}</div>`;
            }
        } catch(e) {
            console.error("Documents Fetch Error:", e);
            listUl.innerHTML = `<div style="color: #e74c3c; font-size: 0.9rem;">Connection error: ${e.message}</div>`;
        }
    };

    window.loadDocumentContent = async function(docName, liElement) {
        // Update active styling
        document.querySelectorAll('.doc-list-item').forEach(el => el.classList.remove('active'));
        if (liElement) liElement.classList.add('active');

        const renderArea = document.getElementById('document-render-area');
        renderArea.innerHTML = '<div style="display: flex; height: 100%; align-items: center; justify-content: center; color: var(--text-dim);"><i class="fa-solid fa-circle-notch fa-spin"></i> Reading document content...</div>';
        
        try {
            const token = sessionStorage.getItem('synora_token') || (typeof App !== 'undefined' ? App.token : '');
            const res = await fetch(`/api/documents/content/${docName}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            
            if (res.status === 200 && data.success && data.content) {
                renderArea.innerHTML = marked.parse(data.content);
            } else {
                const errMsg = data.error || data.message || `Error ${res.status}: Failed to read document.`;
                renderArea.innerHTML = `<div style="color: #e74c3c;">${errMsg}</div>`;
            }
        } catch(e) {
            console.error("Document Content Error:", e);
            renderArea.innerHTML = `<div style="color: #e74c3c;">Failed to load document content: ${e.message}</div>`;
        }
    };
    window.switchDocTab = function(tabName) {
        document.getElementById('tab-system-docs').style.color = '#64748b';
        document.getElementById('tab-system-docs').style.borderBottom = '2px solid transparent';
        document.getElementById('tab-rag-docs').style.color = '#64748b';
        document.getElementById('tab-rag-docs').style.borderBottom = '2px solid transparent';
        
        document.getElementById('view-system-docs').style.display = 'none';
        document.getElementById('view-rag-docs').style.display = 'none';
        
        if (tabName === 'system') {
            document.getElementById('tab-system-docs').style.color = '#2563eb';
            document.getElementById('tab-system-docs').style.borderBottom = '2px solid #2563eb';
            document.getElementById('view-system-docs').style.display = 'flex';
        } else {
            document.getElementById('tab-rag-docs').style.color = '#2563eb';
            document.getElementById('tab-rag-docs').style.borderBottom = '2px solid #2563eb';
            document.getElementById('view-rag-docs').style.display = 'block';
            window.loadRAGDocuments();
        }
    };

    window.loadRAGDocuments = async function() {
        const tbody = document.getElementById('rag-documents-tbody');
        tbody.innerHTML = '<tr><td colspan="2" style="padding: 20px; text-align: center; color: #94a3b8;"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading...</td></tr>';
        
        try {
            const token = sessionStorage.getItem('synora_token') || (typeof App !== 'undefined' ? App.token : '');
            const res = await fetch('/api/rag/documents', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            
            if (res.status === 200 && data.success && data.documents) {
                if (data.documents.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="2" style="padding: 20px; text-align: center; color: #94a3b8;">No RAG context files found. Embed some via Desktop UI first.</td></tr>';
                } else {
                    tbody.innerHTML = '';
                    data.documents.forEach(doc => {
                        const tr = document.createElement('tr');
                        tr.style.borderBottom = '1px solid #e2e8f0';
                        
                        const tdName = document.createElement('td');
                        tdName.style.padding = '12px 16px';
                        tdName.style.fontWeight = '500';
                        tdName.style.color = '#0f172a';
                        tdName.innerHTML = `<i class="fa-solid fa-database" style="color: #64748b; margin-right: 8px;"></i> ${doc}`;
                        
                        const tdAction = document.createElement('td');
                        tdAction.style.padding = '12px 16px';
                        tdAction.style.textAlign = 'right';
                        
                        const delBtn = document.createElement('button');
                        delBtn.innerHTML = '<i class="fa-solid fa-trash"></i>';
                        delBtn.style.cssText = 'background: #fee2e2; border: 1px solid #fca5a5; color: #ef4444; border-radius: 4px; padding: 6px 12px; cursor: pointer; transition: all 0.2s;';
                        delBtn.onmouseover = () => { delBtn.style.background = '#fca5a5'; delBtn.style.color = '#b91c1c'; };
                        delBtn.onmouseout = () => { delBtn.style.background = '#fee2e2'; delBtn.style.color = '#ef4444'; };
                        delBtn.onclick = async () => {
                            if (!confirm(`Permanently delete all indexed vectors for '${doc}'?`)) return;
                            delBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
                            try {
                                const dRes = await fetch(`/api/rag/documents/${encodeURIComponent(doc)}`, {
                                    method: 'DELETE',
                                    headers: { 'Authorization': `Bearer ${token}` }
                                });
                                const dData = await dRes.json();
                                if (dData.success) {
                                    tr.remove();
                                    if (tbody.children.length === 0) {
                                        tbody.innerHTML = '<tr><td colspan="2" style="padding: 20px; text-align: center; color: #94a3b8;">No RAG context files found.</td></tr>';
                                    }
                                } else {
                                    alert('Failed to delete document: ' + (dData.error || 'Unknown error'));
                                    delBtn.innerHTML = '<i class="fa-solid fa-trash"></i>';
                                }
                            } catch (err) {
                                alert('Error: ' + err.message);
                                delBtn.innerHTML = '<i class="fa-solid fa-trash"></i>';
                            }
                        };
                        
                        tdAction.appendChild(delBtn);
                        tr.appendChild(tdName);
                        tr.appendChild(tdAction);
                        tbody.appendChild(tr);
                    });
                }
            } else {
                tbody.innerHTML = `<tr><td colspan="2" style="padding: 20px; text-align: center; color: #ef4444;">${data.error || 'Failed to load documents'}</td></tr>`;
            }
        } catch(e) {
            tbody.innerHTML = `<tr><td colspan="2" style="padding: 20px; text-align: center; color: #ef4444;">Connection error: ${e.message}</td></tr>`;
        }
    };
</script>
