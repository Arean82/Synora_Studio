version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: synora-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__ENABLE_CORS=true
    networks:
      - synora-network
    restart: unless-stopped

  synora-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    container_name: synora-server
    ports:
      - "5000:5000"
    volumes:
      - synora_storage:/app/storage
    environment:
      - QDRANT_URL=http://qdrant:6333
      - DBUS_SESSION_BUS_ADDRESS=/dev/null
    depends_on:
      - qdrant
    networks:
      - synora-network
    restart: unless-stopped

  synora-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: synora-web
    ports:
      - "8080:8080"
    volumes:
      - synora_storage:/app/storage
    environment:
      - DBUS_SESSION_BUS_ADDRESS=/dev/null
      - API_SERVER_URL=http://synora-server:5000
    depends_on:
      - synora-server
    networks:
      - synora-network
    restart: unless-stopped

networks:
  synora-network:
    driver: bridge

volumes:
  qdrant_data:
  synora_storage:
